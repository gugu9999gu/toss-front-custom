<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101217">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>FrontDeck</title>
  <link rel="stylesheet" href="style.css">
  <script src="icons.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="deck">
    <header>
      <div class="heading"><span class="eyebrow">FRONTDECK</span><h1 id="pc-name">내 PC</h1></div>
      <button id="settings" class="settings" aria-label="연결 및 설정"></button>
    </header>
    <div class="connection" role="status"><span class="dot"></span><span id="connection-text">PC 연결 확인 중</span><span id="clock" aria-hidden="true"></span></div>
    <nav id="profiles" aria-label="버튼 모음"></nav>
    <section id="buttons" class="buttons" aria-label="PC 제어 버튼"></section>
    <footer><span id="feedback" role="status">버튼을 눌러 PC를 제어하세요</span><span class="mark">F<span>2</span></span></footer>
  </main>
  <script type="application/json" id="fallback">{"name":"내 PC","profiles":[{"id":"work","name":"작업","actions":[{"id":"notepad","label":"메모장","icon":"note","tone":"blue"},{"id":"calculator","label":"계산기","icon":"calculator","tone":"blue"},{"id":"explorer","label":"파일 탐색기","icon":"folder","tone":"blue"},{"id":"desktop","label":"바탕 화면","icon":"desktop","tone":"slate"},{"id":"taskview","label":"창 전환","icon":"windows","tone":"slate"},{"id":"capture","label":"화면 캡처","icon":"capture","tone":"violet"},{"id":"copy","label":"복사","icon":"copy","tone":"slate"},{"id":"paste","label":"붙여넣기","icon":"paste","tone":"slate"},{"id":"undo","label":"실행 취소","icon":"undo","tone":"slate"},{"id":"find","label":"찾기","icon":"search","tone":"slate"},{"id":"newtab","label":"새 탭","icon":"plus","tone":"slate"},{"id":"escape","label":"닫기 / 취소","icon":"escape","tone":"red"}]},{"id":"media","name":"미디어","actions":[{"id":"previous","label":"이전 곡","icon":"previous","tone":"green"},{"id":"play","label":"재생 / 일시정지","icon":"play","tone":"green"},{"id":"next","label":"다음 곡","icon":"next","tone":"green"},{"id":"quieter","label":"볼륨 −","icon":"volume-down","tone":"slate"},{"id":"mute","label":"음소거","icon":"mute","tone":"red"},{"id":"louder","label":"볼륨 +","icon":"volume-up","tone":"slate"},{"id":"back","label":"뒤로","icon":"back","tone":"slate"},{"id":"fullscreen","label":"전체 화면","icon":"fullscreen","tone":"violet"},{"id":"forward","label":"앞으로","icon":"forward","tone":"slate"},{"id":"refresh","label":"새로고침","icon":"refresh","tone":"slate"},{"id":"youtube","label":"YouTube","icon":"video","tone":"red"},{"id":"explorer","label":"파일 탐색기","icon":"folder","tone":"blue"}]}]}</script>
</body>
</html>
